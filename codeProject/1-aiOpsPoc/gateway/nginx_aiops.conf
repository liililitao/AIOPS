# Nginx 反向代理 — AIOps 认证网关
# 部署: 放到 /etc/nginx/conf.d/ 下, systemctl reload nginx
#
# 端口 80 接收用户请求, 转发给 127.0.0.1:5000 Flask 网关

server {
    listen 80;
    server_name _;

    # 日志 (方便排查)
    access_log /var/log/nginx/aiops_access.log;
    error_log  /var/log/nginx/aiops_error.log;

    # ----- Flask 网关转发 -----
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持流式响应 (SSE/chunked, 同事后端若用到)
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
